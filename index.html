<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>📥 Data Accumulator – Local Save</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0a0e17;
            color: #eef2ff;
            min-height: 100vh;
            padding: 16px;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .container {
            max-width: 900px;
            width: 100%;
            background: #0f172a;
            border-radius: 16px;
            padding: 24px;
            border: 1px solid #1a2744;
        }
        h1 { color: #22c55e; font-size: 22px; }
        .sub { color: #64748b; font-size: 13px; margin-bottom: 16px; }
        .stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            background: #0d1520;
            border-radius: 10px;
            padding: 12px 16px;
            margin-bottom: 16px;
            border: 1px solid #1a2744;
        }
        .stats span { color: #94a3b8; font-size: 13px; }
        .stats strong { color: #eef2ff; font-size: 16px; }
        .stats .leak { color: #ef4444; }
        .stats .secure { color: #22c55e; }

        textarea {
            width: 100%;
            height: 180px;
            background: #060b18;
            border: 2px solid #1a2744;
            border-radius: 8px;
            color: #eef2ff;
            font-size: 12px;
            font-family: 'Courier New', monospace;
            padding: 12px;
            resize: vertical;
            outline: none;
            transition: all 0.3s;
        }
        textarea:focus { border-color: #22c55e; }

        .btn-group {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin: 12px 0;
        }
        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 8px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .btn-success {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
        }
        .btn-success:hover { transform: scale(1.02); }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }
        .btn-danger:hover { transform: scale(1.02); }
        .btn-secondary {
            background: #1a2744;
            color: #94a3b8;
            border: 1px solid #1e2d4a;
        }
        .btn-secondary:hover { background: #1e2d4a; color: #eef2ff; }
        .btn-warning {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff;
        }
        .btn-warning:hover { transform: scale(1.02); }

        .log-area {
            background: #060b18;
            border-radius: 8px;
            border: 1px solid #1a2744;
            padding: 12px;
            max-height: 150px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 11px;
            color: #94a3b8;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 12px;
            display: none;
        }
        .log-area .success { color: #22c55e; }
        .log-area .error { color: #ef4444; }
        .log-area .info { color: #3b82f6; }

        .footer {
            margin-top: 16px;
            font-size: 11px;
            color: #475569;
            text-align: center;
        }
        .footer .warn { color: #ef4444; }
        .record-count {
            font-size: 14px;
            color: #94a3b8;
            margin-top: 8px;
        }
        .record-count strong { color: #22c55e; font-size: 18px; }
    </style>
</head>
<body>

<div class="container">
    <h1>📥 Data Accumulator</h1>
    <div class="sub">Paste CSV data → Save locally → Download Excel</div>

    <div class="stats">
        <span>📊 Total Records: <strong id="totalRecords">0</strong></span>
        <span>📦 Batches: <strong id="batchCount">0</strong></span>
        <span>💾 Last Saved: <strong id="lastSaved">—</strong></span>
    </div>

    <textarea id="csvInput" placeholder="Paste your CSV data here..."></textarea>

    <div class="btn-group">
        <button class="btn btn-success" id="saveBtn"><i class="fas fa-save"></i> Save Batch</button>
        <button class="btn btn-warning" id="downloadBtn"><i class="fas fa-file-excel"></i> Download Excel</button>
        <button class="btn btn-danger" id="clearBtn"><i class="fas fa-trash"></i> Clear All</button>
        <button class="btn btn-secondary" id="previewBtn"><i class="fas fa-eye"></i> Preview</button>
    </div>

    <div class="record-count">
        📋 <strong id="recordCountDisplay">0</strong> records saved locally
    </div>

    <div class="log-area" id="logArea"></div>

    <div class="footer">
        <span class="warn">⚠️</span> Data saved in your browser's local storage.
    </div>
</div>

<script>
    const csvInput = document.getElementById('csvInput');
    const saveBtn = document.getElementById('saveBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const clearBtn = document.getElementById('clearBtn');
    const previewBtn = document.getElementById('previewBtn');
    const logArea = document.getElementById('logArea');
    const totalRecords = document.getElementById('totalRecords');
    const batchCount = document.getElementById('batchCount');
    const lastSaved = document.getElementById('lastSaved');
    const recordCountDisplay = document.getElementById('recordCountDisplay');

    const STORAGE_KEY = 'mgl_backup_data';

    // ─── LOAD FROM LOCAL STORAGE ───
    function loadData() {
        try {
            const stored = localStorage.getItem(STORAGE_KEY);
            return stored ? JSON.parse(stored) : [];
        } catch (e) { return []; }
    }

    // ─── SAVE TO LOCAL STORAGE ───
    function saveData(data) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
        updateStats(data);
    }

    // ─── UPDATE STATS ───
    function updateStats(data) {
        const total = data.length;
        totalRecords.textContent = total;
        recordCountDisplay.textContent = total;
        batchCount.textContent = localStorage.getItem('mgl_batch_count') || 0;
        lastSaved.textContent = new Date().toLocaleTimeString();
    }

    // ─── LOG ───
    function log(msg, type = 'info') {
        logArea.style.display = 'block';
        const line = document.createElement('div');
        line.className = type;
        line.textContent = msg;
        logArea.appendChild(line);
        logArea.scrollTop = logArea.scrollHeight;
    }

    // ─── PARSE CSV ───
    function parseCSV(text) {
        const lines = text.trim().split('\n');
        if (lines.length < 2) return [];
        const headers = lines[0].split(',').map(h => h.trim());
        const result = [];
        for (let i = 1; i < lines.length; i++) {
            const values = lines[i].split(',').map(v => v.trim());
            if (values.length === headers.length) {
                const obj = {};
                headers.forEach((h, idx) => { obj[h] = values[idx] || ''; });
                result.push(obj);
            }
        }
        return result;
    }

    // ─── SAVE BATCH ───
    saveBtn.addEventListener('click', function() {
        const text = csvInput.value.trim();
        if (!text) {
            log('⚠️ No data to save!', 'error');
            return;
        }

        const newData = parseCSV(text);
        if (newData.length === 0) {
            log('⚠️ Invalid CSV format!', 'error');
            return;
        }

        const existing = loadData();
        const combined = existing.concat(newData);
        saveData(combined);

        let batch = parseInt(localStorage.getItem('mgl_batch_count')) || 0;
        batch++;
        localStorage.setItem('mgl_batch_count', batch);

        csvInput.value = '';
        log(`✅ Saved ${newData.length} records! Total: ${combined.length}`, 'success');
        updateStats(combined);
    });

    // ─── DOWNLOAD EXCEL ───
    downloadBtn.addEventListener('click', function() {
        const data = loadData();
        if (data.length === 0) {
            log('⚠️ No data to download!', 'error');
            return;
        }

        const headers = Object.keys(data[0]);
        let csv = headers.join(',') + '\n';
        data.forEach(row => {
            csv += headers.map(h => {
                let val = row[h] || '';
                if (val.includes(',') || val.includes('"')) val = '"' + val.replace(/"/g, '""') + '"';
                return val;
            }).join(',') + '\n';
        });

        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = `backup_${new Date().toISOString().slice(0,10)}_${data.length}_records.csv`;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        URL.revokeObjectURL(url);

        log(`📥 Downloaded ${data.length} records!`, 'success');
    });

    // ─── CLEAR ALL ───
    clearBtn.addEventListener('click', function() {
        if (confirm('⚠️ Delete all saved data?')) {
            localStorage.removeItem(STORAGE_KEY);
            localStorage.removeItem('mgl_batch_count');
            csvInput.value = '';
            log('🗑️ All data cleared!', 'info');
            updateStats([]);
        }
    });

    // ─── PREVIEW ───
    previewBtn.addEventListener('click', function() {
        const data = loadData();
        if (data.length === 0) {
            log('⚠️ No data to preview!', 'error');
            return;
        }
        const preview = data.slice(0, 5);
        log(`📋 Preview (${data.length} total):\n${JSON.stringify(preview, null, 2)}`, 'info');
    });

    // ─── INIT ───
    updateStats(loadData());
    log('💾 Ready! Paste data and click "Save Batch"', 'info');
</script>
</body>
</html>
