<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🏦 IBA BC Converter — Final Fix</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: system-ui, sans-serif; background: #f0f4ff; padding: 16px; }
        .container { max-width: 700px; margin: 0 auto; background: white; border-radius: 20px; padding: 24px; box-shadow: 0 10px 40px rgba(0,0,0,0.1); }
        h1 { font-size: 22px; color: #1a237e; text-align: center; }
        .subtitle { text-align: center; color: #666; font-size: 13px; margin-bottom: 16px; }
        .upload-area { border: 2px dashed #3f51b5; border-radius: 16px; padding: 30px 20px; text-align: center; cursor: pointer; background: #f8f9ff; }
        .upload-area:hover { background: #e8eaf6; }
        .upload-icon { font-size: 40px; }
        .upload-text { font-size: 16px; font-weight: 500; }
        .upload-hint { font-size: 13px; color: #888; }
        #fileInput { display: none; }
        #fileInfo { display: none; margin-top: 12px; padding: 10px 14px; background: #e8f5e9; border-radius: 10px; font-size: 14px; }
        .btn { display: block; width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 16px; font-weight: 600; cursor: pointer; margin-top: 12px; }
        .btn-primary { background: #3f51b5; color: white; }
        .btn-primary:disabled { background: #9fa8da; cursor: not-allowed; }
        .btn-success { background: #2e7d32; color: white; }
        .btn-warning { background: #e65100; color: white; }
        .btn-danger { background: #c62828; color: white; }
        #status { margin-top: 12px; padding: 12px; border-radius: 10px; font-size: 14px; display: none; }
        #status.loading { display: block; background: #fff3e0; color: #e65100; }
        #status.success { display: block; background: #e8f5e9; color: #2e7d32; }
        #status.error { display: block; background: #ffebee; color: #c62828; }
        #status.info { display: block; background: #e3f2fd; color: #0d47a1; }
        .stats { display: none; margin-top: 12px; padding: 12px; background: #f5f5f5; border-radius: 12px; }
        .stats.show { display: block; }
        .stats-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
        .stat-item { background: white; padding: 8px; border-radius: 8px; text-align: center; }
        .stat-item .number { font-size: 22px; font-weight: 700; color: #1a237e; }
        .stat-item .label { font-size: 10px; color: #666; }
        .preview-table { margin-top: 12px; max-height: 300px; overflow: auto; border: 1px solid #e0e0e0; border-radius: 10px; display: none; }
        .preview-table.show { display: block; }
        .preview-table table { width: 100%; border-collapse: collapse; font-size: 12px; }
        .preview-table th { background: #3f51b5; color: white; padding: 6px 8px; text-align: left; position: sticky; top: 0; z-index: 10; }
        .preview-table td { padding: 5px 8px; border-bottom: 1px solid #eee; }
        .preview-table .phone-found { color: #2e7d32; font-weight: 600; }
        .preview-table .phone-missing { color: #c62828; }
        .download-section { display: none; margin-top: 12px; }
        .download-section.show { display: block; }
        .footer { text-align: center; margin-top: 16px; color: #999; font-size: 11px; }
        .key-status { display: none; margin-top: 8px; padding: 8px 12px; background: #fff8e1; border-radius: 8px; font-size: 13px; }
        .key-status.show { display: block; }
        .key-status .found { color: #2e7d32; font-weight: 600; }
        .key-status .not-found { color: #c62828; font-weight: 600; }
    </style>
</head>
<body>

<div class="container">
    <h1>🏦 IBA BC Converter — Final</h1>
    <p class="subtitle">HTML se Excel + Real Decryption</p>

    <div class="upload-area" id="uploadArea">
        <div class="upload-icon">📂</div>
        <div class="upload-text">Tap to select HTML file</div>
        <div class="upload-hint">.html .htm .txt (Max 50MB)</div>
    </div>

    <input type="file" id="fileInput" accept=".html,.htm,.txt">

    <div id="fileInfo">
        <div>📄 <span class="file-name" id="fileName">-</span></div>
        <div id="fileSize">-</div>
    </div>

    <button class="btn btn-primary" id="convertBtn" disabled>🔄 Convert to Excel</button>

    <div id="keyStatus" class="key-status"></div>
    <div id="status"></div>

    <div class="stats" id="stats">
        <div class="stats-grid">
            <div class="stat-item"><div class="number" id="totalRecords">0</div><div class="label">Total</div></div>
            <div class="stat-item"><div class="number" id="phonesFound">0</div><div class="label">Phones</div></div>
            <div class="stat-item"><div class="number" id="decryptRate">0%</div><div class="label">Decrypt Rate</div></div>
        </div>
    </div>

    <div class="preview-table" id="previewTable"></div>

    <div class="download-section" id="downloadSection">
        <button class="btn btn-success" id="downloadBtn">📥 Download Excel (CSV)</button>
        <button class="btn btn-danger" id="resetBtn" style="background:#757575; margin-top:8px;">🔄 Reset</button>
    </div>

    <div class="footer">Data stays on your device • No upload to server</div>
</div>

<script>
    // ================================================================
    // FINAL FIX — REAL DECRYPTION WITH BITWISE COMPLEMENT
    // ================================================================

    const uploadArea = document.getElementById('uploadArea');
    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const fileName = document.getElementById('fileName');
    const fileSize = document.getElementById('fileSize');
    const convertBtn = document.getElementById('convertBtn');
    const statusDiv = document.getElementById('status');
    const statsDiv = document.getElementById('stats');
    const totalRecords = document.getElementById('totalRecords');
    const phonesFound = document.getElementById('phonesFound');
    const decryptRate = document.getElementById('decryptRate');
    const previewTable = document.getElementById('previewTable');
    const downloadSection = document.getElementById('downloadSection');
    const downloadBtn = document.getElementById('downloadBtn');
    const resetBtn = document.getElementById('resetBtn');
    const keyStatus = document.getElementById('keyStatus');

    let currentData = [];
    let currentHtmlContent = '';

    // ----- Upload -----
    uploadArea.addEventListener('click', () => fileInput.click());

    fileInput.addEventListener('change', (e) => {
        if (e.target.files.length) {
            const file = e.target.files[0];
            if (file.size > 50 * 1024 * 1024) {
                showStatus('❌ File too large! Max 50MB.', 'error');
                return;
            }
            fileName.textContent = file.name;
            fileSize.textContent = (file.size / 1024 / 1024).toFixed(2) + ' MB';
            fileInfo.style.display = 'block';
            convertBtn.disabled = false;
            showStatus('✅ File loaded! Tap "Convert" to process.', 'info');

            const reader = new FileReader();
            reader.onload = (e) => {
                currentHtmlContent = e.target.result;
            };
            reader.readAsText(file);
        }
    });

    // ----- Convert Button -----
    convertBtn.addEventListener('click', () => {
        if (!currentHtmlContent) {
            showStatus('❌ No file loaded!', 'error');
            return;
        }
        processHtml(currentHtmlContent);
    });

    // ================================================================
    // REAL DECRYPTION — XOR + BITWISE COMPLEMENT
    // ================================================================
    function realDecrypt(encrypted) {
        try {
            // Step 1: Base64 Decode
            const decoded = atob(encrypted);
            
            // Step 2: XOR + Bitwise Complement with 'remittance' key
            const key = 'remittance';
            let result = '';
            for (let i = 0; i < decoded.length; i++) {
                // XOR
                let charCode = decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length);
                // Bitwise Complement (Java's ~ operator)
                charCode = ~charCode;
                // Convert to unsigned byte (0-255)
                charCode = charCode & 0xFF;
                result += String.fromCharCode(charCode);
            }
            
            // Step 3: Extract digits
            let phone = result.replace(/[^0-9]/g, '');
            if (phone.length >= 10) {
                return phone.slice(-10);
            }
            
            // Fallback: Try without complement
            let fallbackResult = '';
            for (let i = 0; i < decoded.length; i++) {
                let charCode = decoded.charCodeAt(i) ^ key.charCodeAt(i % key.length);
                fallbackResult += String.fromCharCode(charCode);
            }
            let fallbackPhone = fallbackResult.replace(/[^0-9]/g, '');
            if (fallbackPhone.length >= 10) {
                return fallbackPhone.slice(-10);
            }
            
            return null;
        } catch (e) {
            return null;
        }
    }

    // ----- Main Processing -----
    function processHtml(html) {
        showStatus('⏳ Processing HTML... Please wait.', 'loading');
        convertBtn.disabled = true;

        setTimeout(() => {
            try {
                const parser = new DOMParser();
                const doc = parser.parseFromString(html, 'text/html');

                let results = [];
                let rows = doc.querySelectorAll('table tbody tr');
                
                if (rows.length === 0) {
                    rows = doc.querySelectorAll('tr[role="row"]');
                }
                if (rows.length === 0) {
                    rows = doc.querySelectorAll('tr');
                }

                let encryptedFound = 0;
                let decryptedCount = 0;

                rows.forEach(row => {
                    try {
                        const cells = row.querySelectorAll('td');
                        if (cells.length < 3) return;

                        let name = '';
                        let id = '';
                        const nameLink = row.querySelector('.BcDetail');
                        if (nameLink) {
                            name = nameLink.textContent.trim();
                            id = nameLink.getAttribute('data-bcid') || '';
                        } else if (cells.length > 1) {
                            name = cells[1].textContent.trim();
                        }
                        if (!name || name.length < 2) return;

                        const pincode = cells.length > 2 ? cells[2].textContent.trim() : 'N/A';
                        const bank = cells.length > 3 ? cells[3].textContent.trim() : 'N/A';
                        const type = cells.length > 4 ? cells[4].textContent.trim() : 'N/A';

                        let encrypted = '';
                        const callBtn = row.querySelector('.btnCallNow');
                        if (callBtn) {
                            encrypted = callBtn.getAttribute('data-phn') || '';
                        }

                        let phone = 'N/A';
                        if (encrypted) {
                            encryptedFound++;
                            const decrypted = realDecrypt(encrypted);
                            if (decrypted && decrypted.length >= 10) {
                                phone = decrypted;
                                decryptedCount++;
                            }
                        }

                        // Try direct tel link
                        if (phone === 'N/A') {
                            const telLink = row.querySelector('a[href*="tel:"]');
                            if (telLink) {
                                const href = telLink.getAttribute('href') || '';
                                const num = href.replace('tel:', '').replace(/[^0-9]/g, '');
                                if (num.length >= 10) {
                                    phone = num.slice(-10);
                                    decryptedCount++;
                                }
                            }
                        }

                        let coords = 'N/A';
                        const dirLink = row.querySelector('a[href*="google.com/maps"]');
                        if (dirLink) {
                            const href = dirLink.getAttribute('href') || '';
                            if (href.includes('destination=')) {
                                coords = href.split('destination=')[1].split('&')[0];
                            }
                        }

                        results.push({
                            name: name,
                            id: id,
                            pincode: pincode,
                            bank: bank,
                            type: type,
                            phone: phone,
                            coords: coords
                        });

                    } catch (err) {}
                });

                if (results.length === 0) {
                    showStatus('❌ No BC records found!', 'error');
                    convertBtn.disabled = false;
                    return;
                }

                currentData = results;

                const total = results.length;
                const phones = results.filter(r => r.phone && r.phone !== 'N/A' && r.phone.length >= 10).length;
                const rate = total > 0 ? Math.round((phones / total) * 100) : 0;

                totalRecords.textContent = total;
                phonesFound.textContent = phones;
                decryptRate.textContent = rate + '%';
                statsDiv.classList.add('show');

                showPreview(results);
                downloadSection.classList.add('show');

                if (phones > 0) {
                    keyStatus.innerHTML = '🔓 <span class="found">Decryption successful!</span> ' + phones + ' phone numbers found.';
                    keyStatus.classList.add('show');
                } else {
                    keyStatus.innerHTML = '🔒 <span class="not-found">Decryption failed.</span> ' + encryptedFound + ' encrypted strings found, but none could be decrypted.';
                    keyStatus.classList.add('show');
                }

                showStatus(`✅ Success! ${results.length} BC records extracted.`, 'success');
                convertBtn.disabled = false;

            } catch (err) {
                showStatus('❌ Error: ' + err.message, 'error');
                convertBtn.disabled = false;
            }
        }, 150);
    }

    // ----- Preview -----
    function showPreview(data) {
        const maxPreview = Math.min(data.length, 15);
        let html = `<table><thead><tr><th>#</th><th>BC Name</th><th>Bank</th><th>Phone</th><th>Pincode</th></tr></thead><tbody>`;
        for (let i = 0; i < maxPreview; i++) {
            const row = data[i];
            const phoneClass = row.phone && row.phone !== 'N/A' && row.phone.length >= 10 ? 'phone-found' : 'phone-missing';
            html += `<tr><td>${i+1}</td><td>${row.name.substring(0, 25)}</td><td>${row.bank}</td><td class="${phoneClass}">${row.phone || 'N/A'}</td><td>${row.pincode}</td></tr>`;
        }
        html += `</tbody></table>`;
        if (data.length > 15) {
            html += `<p style="text-align:center;padding:8px;color:#666;font-size:12px;">... and ${data.length - 15} more</p>`;
        }
        previewTable.innerHTML = html;
        previewTable.classList.add('show');
    }

    // ----- Download CSV -----
    downloadBtn.addEventListener('click', () => {
        if (currentData.length === 0) {
            showStatus('❌ No data to download!', 'error');
            return;
        }
        const headers = ['S.No', 'BC Name', 'BC ID', 'Pincode', 'Bank Name', 'BC Type', 'Phone Number', 'Coordinates'];
        let csv = headers.join(',') + '\n';
        currentData.forEach((row, idx) => {
            csv += [
                idx + 1,
                `"${row.name}"`,
                `"${row.id}"`,
                `"${row.pincode}"`,
                `"${row.bank}"`,
                `"${row.type}"`,
                `"${row.phone || 'N/A'}"`,
                `"${row.coords}"`
            ].join(',') + '\n';
        });
        const blob = new Blob(['\uFEFF' + csv], { type: 'text/csv;charset=utf-8;' });
        const link = document.createElement('a');
        const url = URL.createObjectURL(blob);
        link.href = url;
        const ts = new Date().toISOString().slice(0, 19).replace(/[:-]/g, '');
        link.download = `BC_Registry_Data_${ts}.csv`;
        document.body.appendChild(link);
        link.click();
        document.body.removeChild(link);
        URL.revokeObjectURL(url);
        showStatus('📥 Download started!', 'success');
    });

    // ----- Reset -----
    resetBtn.addEventListener('click', () => {
        currentData = [];
        currentHtmlContent = '';
        fileInput.value = '';
        fileInfo.style.display = 'none';
        convertBtn.disabled = true;
        statsDiv.classList.remove('show');
        previewTable.classList.remove('show');
        previewTable.innerHTML = '';
        downloadSection.classList.remove('show');
        keyStatus.classList.remove('show');
        statusDiv.style.display = 'none';
    });

    // ----- Status -----
    function showStatus(msg, type) {
        statusDiv.textContent = msg;
        statusDiv.className = type;
        statusDiv.style.display = 'block';
    }
</script>
</body>
</html>
